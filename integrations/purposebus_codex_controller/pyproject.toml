[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purposebus-codex-controller"
version = "0.0.0a0"
description = "Non-runnable policy skeleton for a future PurposeBus Codex controller"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
