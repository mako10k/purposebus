[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purposebus-mcp"
version = "0.1.0a0"
description = "Local read-only MCP adapter for PurposeBus"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  "pydantic>=2.12,<3",
]

[project.scripts]
purposebus-mcp = "purposebus_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
